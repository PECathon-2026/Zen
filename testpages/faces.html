<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Faces and images in pictures (synthetic page, public-domain NASA portrait)</title>
<style>body{font:16px sans-serif;margin:16px}figure{display:inline-block;margin:0 12px 12px 0;vertical-align:top}figcaption{font-size:12px;color:#444}</style></head>
<body>
<figure><img id="same" width="300" height="300" src="img/nasa_pd_1.png"><figcaption>same origin</figcaption></figure>
<figure><img id="cross" width="300" height="300" alt=""><figcaption>cross origin</figcaption></figure>
<figure><img id="fit" width="300" height="160" style="object-fit:contain;background:#eee" src="img/nasa_pd_1.png"><figcaption>object-fit: contain</figcaption></figure>
<figure><img id="clean" width="200" height="140" alt=""><figcaption>no face, no text</figcaption></figure>
<figure><img id="textimg" src="img/card_text.png"><figcaption>text inside a picture</figcaption></figure>
<figure><canvas id="cvtext" width="320" height="70"></canvas><figcaption>text drawn in a canvas</figcaption></figure>
<script>
const x = new URLSearchParams(location.hash.slice(1)).get('x'); if (x) document.getElementById('cross').src = x + '/img/nasa_pd_1.png';
const g = document.createElement('canvas'); g.width = 200; g.height = 140; const gc = g.getContext('2d'), gr = gc.createLinearGradient(0, 0, 200, 140);
gr.addColorStop(0, '#f2e2b8'); gr.addColorStop(1, '#bfe3d6'); gc.fillStyle = gr; gc.fillRect(0, 0, 200, 140); document.getElementById('clean').src = g.toDataURL('image/png');
const c = document.getElementById('cvtext').getContext('2d'); c.fillStyle = '#fff'; c.fillRect(0, 0, 320, 70); c.fillStyle = '#000'; c.font = '26px sans-serif'; c.fillText('4111 1111 1111 1111', 10, 44);
</script></body></html>
