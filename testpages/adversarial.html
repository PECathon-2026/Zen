<script>
const host = document.getElementById('shadow-host'), sr = host.attachShadow({mode: 'open'});
sr.innerHTML = '<p id="sh-text">Card 4111 1111 1111 1111</p><input id="sh-field" autocomplete="cc-number" value="4111 1111 1111 1111" style="width:260px">';
// a live MediaStream on a video with no hint at all: this is what a video-call tile looks like
const c = document.createElement('canvas'); c.width = 64; c.height = 48; c.getContext('2d').fillRect(0, 0, 64, 48);

document.getElementById('photo').src = ph.toDataURL('image/png');
